name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report full dependency audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const report = require("/tmp/npm-audit.json");
          const vulnerabilities = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            range: item.range,
            fixAvailable: item.fixAvailable,
            direct: item.isDirect,
          }));
          console.log(JSON.stringify({
            counts: report.metadata?.vulnerabilities,
            vulnerabilities,
          }, null, 2));
          NODE
      - name: Lint
        run: npm run lint
      - name: Test URL validation and SSRF defenses
        run: npm test
      - name: Build production app
        run: npm run build
